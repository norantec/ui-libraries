# .github/workflows/publish.yml
name: Publish Node.js Package

on:
  push:
    branches:
      - master
      - alpha
      - beta
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com/'

      - name: Check project
        run: ls -al

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm i --legacy-peer-deps=true

      - name: Run build
        run: npm run build

      - name: Pack-up cache
        run: |
          zip -r cache.zip lib-esm lib-cjs demo

      - name: Upload cache
        uses: actions/cache@v4
        if: |
          github.ref == 'refs/heads/alpha' ||
          github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/release'
        with:
          key: cache-${{ github.run_id }}
          path: cache.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      github.ref == 'refs/heads/alpha' ||
      github.ref == 'refs/heads/beta' ||
      github.ref == 'refs/heads/release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com/'

      - name: Download cache
        uses: actions/cache@v4
        with:
          key: cache-${{ github.run_id }}
          path: cache.zip

      - name: Extract cache
        run: |
          unzip -o cache.zip

      - name: Check cache
        run: |
          ls -al ./lib-esm
          ls -al ./lib-cjs
          ls -al ./demo

      - name: Install Norantec Toolchain
        run: npm i @open-norantec/toolchain -g

      - name: Release with semantic-release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: nttc bump --config ./bump.config.json --type $BRANCH_NAME

      - name: Prepare NPMRC
        run: |
          echo "always-auth=true" >> ./.npmrc
          echo "@open-norantec:registry=https://registry.npmjs.org" >> ./.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ./.npmrc

      - name: Publish package
        run: npm publish
